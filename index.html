
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>O Projeto | Arquivo Secreto</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #08070d;
            color: #eee5f5;
            font-family: monospace;
            text-align: center;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header,
        footer {
            padding: 22px 12px;
            color: #8d829e;
            font-size: 11px;
            letter-spacing: 2px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 18px;
        }

        .warning {
            color: #ff496c;
            letter-spacing: 3px;
            animation: flicker 2s infinite;
        }

        h1 {
            font-size: clamp(36px, 12vw, 68px);
            letter-spacing: 5px;
            color: #f4eafa;
            text-shadow: 3px 0 #ff3158, -3px 0 #5948ff;
        }

        .subtitle {
            color: #a99bb7;
            line-height: 1.8;
            max-width: 300px;
        }

        button {
            margin-top: 28px;
            padding: 16px 20px;
            background: transparent;
            color: #ff6684;
            border: 1px solid #ff496c;
            font-family: monospace;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        button:hover {
            background: #ff496c;
            color: #08070d;
        }

        button:focus-visible {
            outline: 2px solid #eee5f5;
            outline-offset: 5px;
        }

        #secret-message {
            margin-top: 24px;
            color: #ff496c;
            line-height: 1.8;
        }

        [hidden] {
            display: none !important;
        }

        /* INTERFERÊNCIA DIGITAL */
        body.glitching {
            animation: screen-glitch 0.15s steps(2, end) infinite;
        }

        body.glitching main {
            animation: content-glitch 0.12s steps(2, end) infinite;
        }

        body.glitching h1 {
            text-shadow:
                5px 0 #ff1744,
                -5px 0 #4b36ff,
                0 0 18px #ff1744;
        }

        body.glitching::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 999;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 3px,
                rgba(255, 49, 88, 0.2) 4px,
                transparent 5px
            );
        }

        @keyframes screen-glitch {
            0% {
                transform: translate(0, 0);
                filter: none;
            }

            25% {
                transform: translate(4px, -2px);
                filter: hue-rotate(90deg);
            }

            50% {
                transform: translate(-4px, 2px);
                filter: invert(0.15);
            }

            75% {
                transform: translate(2px, 1px);
                filter: hue-rotate(-90deg);
            }

            100% {
                transform: translate(0, 0);
                filter: none;
            }
        }

        @keyframes content-glitch {
            0% {
                transform: translateX(0);
                clip-path: inset(0);
            }

            33% {
                transform: translateX(8px);
                clip-path: inset(20% 0 55% 0);
            }

            66% {
                transform: translateX(-8px);
                clip-path: inset(60% 0 10% 0);
            }

            100% {
                transform: translateX(0);
                clip-path: inset(0);
            }
        }

        /* Respeita a preferência por menos animações */
        @media (prefers-reduced-motion: reduce) {
            .warning {
                animation: none;
            }

            body.glitching,
            body.glitching main {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <header>
        <p>ARQUIVO CONFIDENCIAL // MUNDO G</p>
    </header>

    <main>
        <p class="warning">⚠ SINAL INSTÁVEL</p>

        <h1>O PROJETO</h1>

        <p class="subtitle">
            Nem tudo o que desaparece deixa de existir.
        </p>

        <button id="enter-button">
            ENTRAR NO ARQUIVO
        </button>

        <p id="secret-message" hidden aria-live="polite">
            ERRO 001: NÃO DEVIA ESTAR AQUI.
            <br>
            <span>O ARQUIVO FOI COMPROMETIDO.</span>
        </p>
    </main>

    <footer>
        REGISTO 001 // FICHEIRO INCOMPLETO
    </footer>

    <script>
        const button = document.getElementById("enter-button");
        const message = document.getElementById("secret-message");

        let glitchTimer;

        button.addEventListener("click", function () {
            clearTimeout(glitchTimer);

            document.body.classList.add("glitching");
            message.hidden = false;

            button.textContent = "ERRO NO SISTEMA...";
            button.disabled = true;

            glitchTimer = setTimeout(function () {
                document.body.classList.remove("glitching");

                button.textContent = "TENTAR NOVAMENTE";
                button.disabled = false;
            }, 2500);
        });
    </script>

</body>
</html>
