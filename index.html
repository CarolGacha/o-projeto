
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>O Projeto | Arquivo Secreto</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #08070d;
            color: #eee5f5;
            font-family: monospace;
            text-align: center;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header,
        footer {
            padding: 22px 12px;
            color: #8d829e;
            font-size: 11px;
            letter-spacing: 2px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 18px;
        }

        .warning {
            color: #ff496c;
            letter-spacing: 3px;
            animation: flicker 2s infinite;
        }

        h1 {
            font-size: clamp(36px, 12vw, 68px);
            letter-spacing: 5px;
            color: #f4eafa;
            text-shadow: 3px 0 #ff3158, -3px 0 #5948ff;
        }

        .subtitle {
            color: #a99bb7;
            line-height: 1.8;
            max-width: 300px;
        }

        button {
            margin-top: 28px;
            padding: 16px 20px;
            background: transparent;
            color: #ff6684;
            border: 1px solid #ff496c;
            font-family: monospace;
            letter-spacing: 2px;
            cursor: pointer;
        }

        button:hover {
            background: #ff496c;
            color: #08070d;
        }

        #secret-message {
            margin-top: 24px;
            color: #ff496c;
            line-height: 1.8;
        }

        [hidden] {
            display: none !important;
        }

        @keyframes flicker {
            0%, 19%, 21%, 100% {
                opacity: 1;
            }

            20%, 60% {
                opacity: 0.65;
            }
        }

        /* GLITCH DO ALGORITHMUS */

        body.glitching {
            animation: screen-glitch 0.12s steps(2, end) infinite;
        }

        body.glitching main {
            animation: content-glitch 0.12s steps(2, end) infinite;
        }

        body.glitching h1 {
            text-shadow:
                6px 0 #ff1744,
                -6px 0 #4936ff,
                0 0 20px #ff1744;
        }

        body.glitching::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 3px,
                rgba(255, 49, 88, 0.3) 4px,
                transparent 5px
            );
        }

        @keyframes screen-glitch {
            0% {
                transform: translate(0, 0);
                filter: none;
            }

            25% {
                transform: translate(5px, -3px);
                filter: hue-rotate(100deg);
            }

            50% {
                transform: translate(-5px, 3px);
                filter: invert(0.2);
            }

            75% {
                transform: translate(3px, 1px);
                filter: hue-rotate(-100deg);
            }

            100% {
                transform: translate(0, 0);
                filter: none;
            }
        }

        @keyframes content-glitch {
            0% {
                transform: translateX(0);
                clip-path: inset(0);
            }

            33% {
                transform: translateX(9px);
                clip-path: inset(20% 0 55% 0);
            }

            66% {
                transform: translateX(-9px);
                clip-path: inset(60% 0 10% 0);
            }

            100% {
                transform: translateX(0);
                clip-path: inset(0);
            }
        }

        /* TERMINAL INFETADO */

        #terminal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #020503;
            color: #39ff88;
            padding: 28px 22px;
            text-align: left;
            font-family: monospace;
            overflow-y: auto;
        }

        #terminal[hidden] {
            display: none !important;
        }

        .terminal-header {
            color: #7affaa;
            border-bottom: 1px solid #23683d;
            padding-bottom: 14px;
            margin-bottom: 24px;
            font-size: 12px;
            letter-spacing: 2px;
        }

        #terminal-output {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.9;
            font-size: 14px;
        }

        .danger {
            color: #ff496c;
            text-shadow: 0 0 8px #ff1744;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: #39ff88;
            vertical-align: middle;
            animation: cursor-blink 0.7s steps(2, end) infinite;
        }

        #restart-button {
            margin-top: 28px;
            border-color: #39ff88;
            color: #39ff88;
        }

        #restart-button:hover {
            background: #39ff88;
            color: #020503;
        }

        @keyframes cursor-blink {
            50% {
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            #terminal {
                padding: 22px 15px;
            }

            #terminal-output {
                font-size: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .warning,
            .cursor {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <header>
        <p>ARQUIVO CONFIDENCIAL // MUNDO G</p>
    </header>

    <main id="main-content">
        <p class="warning">⚠ SINAL INSTÁVEL</p>

        <h1>O PROJETO</h1>

        <p class="subtitle">
            Nem tudo o que desaparece deixa de existir.
        </p>

        <button id="enter-button">
            ENTRAR NO ARQUIVO
        </button>

        <p id="secret-message" hidden>
            ERRO 001: NÃO DEVIA ESTAR AQUI.
        </p>
    </main>

    <footer id="page-footer">
        REGISTO 001 // FICHEIRO INCOMPLETO
    </footer>

    <!-- O TERMINAL SÓ APARECE DEPOIS DO GLITCH -->

    <section id="terminal" hidden aria-label="Terminal secreto">
        <div class="terminal-header">
            MUNDO G // TERMINAL DE EMERGÊNCIA
        </div>

        <div id="terminal-output" aria-live="polite"></div>
        <span class="cursor" id="terminal-cursor"></span>

        <button id="restart-button" hidden>
            REINICIAR ARQUIVO
        </button>
    </section>

    <script>
        const button = document.getElementById("enter-button");
        const message = document.getElementById("secret-message");
        const terminal = document.getElementById("terminal");
        const output = document.getElementById("terminal-output");
        const cursor = document.getElementById("terminal-cursor");
        const restartButton = document.getElementById("restart-button");

        let timers = [];

        const wait = (ms) => new Promise(resolve => {
            const timer = setTimeout(resolve, ms);
            timers.push(timer);
        });

        const messages = [
            { text: "> A ANALISAR FICHEIRO...", delay: 650 },
            { text: "> A LIGAR AO SERVIDOR DO MUNDO G...", delay: 900 },
            { text: "> ERRO: SINAL DESCONHECIDO.", delay: 850 },
            { text: "> ANOMALIA DETETADA.", delay: 1000 },
            { text: "> A VERIFICAR ORIGEM DA ANOMALIA...", delay: 1000 },
            { text: "> ALGORITHMUS: PRESENTE", delay: 1300, danger: true },
            { text: "> ", delay: 700 },
            { text: "> AVISO: O FICHEIRO ESTÁ COMPROMETIDO.", delay: 1200, danger: true },
            { text: "> NÃO DEVIA TERES ENTRADO.", delay: 1500, danger: true },
            { text: "> EU SEI QUE ESTÁS AÍ.", delay: 1800, danger: true },
            { text: "> A OBSERVAR...", delay: 1200, danger: true }
        ];

        async function typeMessage(item) {
            const line = document.createElement("div");

            if (item.danger) {
                line.classList.add("danger");
            }

            output.appendChild(line);

            for (const character of item.text) {
                line.textContent += character;
                await wait(28);
            }

            await wait(item.delay);
        }

        async function startInfection() {
            button.disabled = true;
            message.hidden = false;

            document.body.classList.add("glitching");

            await wait(2500);

            document.body.classList.remove("glitching");

            document.getElementById("main-content").hidden = true;
            document.getElementById("page-footer").hidden = true;
            document.querySelector("header").hidden = true;

            terminal.hidden = false;
            document.body.style.background = "#020503";
            document.body.style.textAlign = "left";

            output.textContent = "";

            for (const item of messages) {
                await typeMessage(item);
            }

            cursor.hidden = true;
            restartButton.hidden = false;
        }

        button.addEventListener("click", startInfection);

        restartButton.addEventListener("click", function () {
            timers.forEach(clearTimeout);
            timers = [];

            document.body.classList.remove("glitching");
            document.body.style.background = "#08070d";
            document.body.style.textAlign = "center";

            terminal.hidden = true;
            document.getElementById("main-content").hidden = false;
            document.getElementById("page-footer").hidden = false;
            document.querySelector("header").hidden = false;

            message.hidden = true;
            button.disabled = false;
            button.textContent = "ENTRAR NO ARQUIVO";

            output.textContent = "";
            cursor.hidden = false;
            restartButton.hidden = true;
        });
    </script>

</body>
</html>
